# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - func-nvda-sentiment

on:
  push:
    branches:
      - main
    paths:
      - 'function-app/**'
      - '.github/workflows/main_func-nvda-sentiment.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './function-app'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Linux Consumption runs an older glibc than ubuntu-latest.
      # Refuse native wheels requiring a newer ABI or local source builds.
      - name: Install Linux-compatible deployment dependencies
        working-directory: ./function-app
        run: |
          python -m pip install --target=".python_packages/lib/site-packages" --platform manylinux2014_x86_64 --implementation cp --python-version 3.11 --only-binary=:all: -r requirements.txt

      - name: Check function registration before deployment
        working-directory: ./function-app
        env:
          PYTHONPATH: .python_packages/lib/site-packages
          RAPIDAPI_HOST: test.invalid
          RAPIDAPI_KEY: ci-placeholder
          STORAGE_ACCOUNT_NAME: citeststorage
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import re
          import subprocess
          # Check actual ELF requirements, not just wheel tags.
          for library in Path(".python_packages/lib/site-packages").rglob("*.so"):
              output = subprocess.check_output(["readelf", "--version-info", str(library)], text=True)
              versions = [tuple(map(int, v.split("."))) for v in re.findall(r"GLIBC_(\d+\.\d+(?:\.\d+)?)", output)]
              assert all(v <= (2, 17) for v in versions), (str(library), versions)
          import function_app
          import tweet_backfill
          names = {f.get_function_name() for f in function_app.app.get_functions()}
          expected = {"daily_nvda_ingestion", "manual_nvda_ingestion", "backfill_nvda_tweets"}
          assert names == expected, names
          print("Registered functions:", sorted(names))
          PYTHON

      - name: Zip artifact for deployment
        run: zip -r release.zip function-app

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_05BFEBEE6A944593AC661C43185E14C5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BD9A68064C71452D811DD22FBF8519E3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D5AE17F25F1947D4BA2B3CD2FD3070EA }}

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'func-nvda-sentiment'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
